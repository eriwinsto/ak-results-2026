# One-time test: can GitHub's servers download the Division's results? Changes nothing.
name: Probe Division results download
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-enr.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose connection
        run: |
          UA="AlaskaPublicMedia-results-map/1.0 (newsroom results graphic)"
          echo "== DNS"; getent hosts www.elections.alaska.gov || echo "no DNS"
          for u in https://www.elections.alaska.gov/ https://www.elections.alaska.gov/enr/26GENR/results/GA_ENR_Precinct_State_of_Alaska.csv http://www.elections.alaska.gov/ https://alaska.gov/; do
            echo "== $u"
            curl -sS -m 30 -A "$UA" -o /dev/null -w 'status %{http_code}, connect %{time_connect}s, tls %{time_appconnect}s, %{size_download} bytes, ip %{remote_ip}\n' "$u" 2>&1 || echo "curl exit $?"
          done
