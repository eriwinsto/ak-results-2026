# One-time test: can GitHub's servers download the Division's results? Changes nothing.
name: Probe Division results download
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-enr.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose certificate and download
        run: |
          H=www.elections.alaska.gov
          echo | openssl s_client -connect $H:443 -servername $H -showcerts 2>/dev/null > chain.txt || true
          echo "== certificates the server sends:"; grep -E '^ *[0-9] s:|^ *i:' chain.txt
          awk '/BEGIN CERT/{f=1} f{print} /END CERT/{exit}' chain.txt > leaf.pem
          echo "== leaf issuer / AIA:"; openssl x509 -in leaf.pem -noout -issuer -enddate -ext authorityInfoAccess
          AIA=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:[^ ]*' | sed 's/CA Issuers - URI://')
          echo "== fetching missing intermediate from $AIA"
          curl -sS -m 30 -o inter.der "$AIA"
          (openssl x509 -inform DER -in inter.der -out inter.pem 2>/dev/null || cp inter.der inter.pem)
          openssl x509 -in inter.pem -noout -subject -issuer
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          UA="AlaskaPublicMedia-results-map/1.0 (newsroom results graphic)"
          echo "== page with completed chain"
          curl -sS -m 30 --cacert bundle.pem -A "$UA" -o page.html -w 'status %{http_code}, %{size_download} bytes\n' "https://$H/enr/26GENR/"
          echo "-- last updated:"; grep -io 'last updated[^<]*' page.html | head -3 || echo "(not in page HTML)"
          echo "-- data files referenced:"; grep -oiE '"[^"]*\.(json|csv)[^"]*"' page.html | sort -u | head -20 || true
          echo "== csv with completed chain"
          curl -sS -m 60 --cacert bundle.pem -A "$UA" -D csv.h -o r.csv -w 'status %{http_code}, %{size_download} bytes\n' "https://$H/enr/26GENR/results/GA_ENR_Precinct_State_of_Alaska.csv"
          grep -iE '^(last-modified|etag|content-type|cache-control|age|x-cache):' csv.h || true
          head -c 300 r.csv; echo; echo "rows: $(wc -l < r.csv)"
