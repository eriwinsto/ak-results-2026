# One-time test: can GitHub's servers download the Division's results? Changes nothing.
name: Probe Division results download
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-enr.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find where the page gets its "last updated" time
        run: |
          H=www.elections.alaska.gov
          curl -sS -m 30 -o inter.der http://secure.globalsign.com/cacert/gsgccr46ovtlsca2025.crt
          openssl x509 -inform DER -in inter.der -out inter.pem
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          UA="AlaskaPublicMedia-results-map/1.0 (newsroom results graphic)"
          get() { curl -sS -m 30 --cacert bundle.pem -A "$UA" "$@"; }
          get -o page.html "https://$H/enr/26GENR/"
          echo "== script/link/fetch references in page:"; grep -oiE '(src|href)="[^"]+"|fetch\([^)]*\)|\$\.(get|getJSON|ajax)\([^)]*' page.html | grep -viE '\.(png|jpg|svg|css|ico)"|https?://(www\.)?(google|facebook|twitter)' | sort -u | head -60
          echo "== text near 'updated':"; grep -ioE '.{0,200}updated.{0,200}' page.html | head -5
          for s in $(grep -oiE 'src="[^"]+\.js[^"]*"' page.html | sed -E 's/src="([^"]+)"/\1/' | grep -v '^https\?://' ); do
            case "$s" in /*) u="https://$H$s";; *) u="https://$H/enr/26GENR/$s";; esac
            get -o s.js "$u" || continue
            if grep -qi 'updated' s.js; then echo "== $u mentions 'updated':"; grep -ioE '.{0,160}updated.{0,160}' s.js | head -4; grep -oiE '["'"'"'][^"'"'"' ]*\.(json|csv|txt|xml)[^"'"'"' ]*["'"'"']' s.js | sort -u | head -15; fi
          done
